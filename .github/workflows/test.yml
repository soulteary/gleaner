name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      - name: Install CGO dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./... -count=1

      - name: Build binaries
        run: |
          go build -o /tmp/gleaner-server ./cmd/gleaner-server
          go build -o /tmp/gleaner ./cmd/gleaner

  test-gse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      - name: Go test (GSE, no CGO)
        env:
          CGO_ENABLED: "0"
          GLEANER_SEGMENT_BACKEND: gse
        run: go test ./... -count=1

      - name: Build GSE server
        env:
          CGO_ENABLED: "0"
          GLEANER_SEGMENT_BACKEND: gse
        run: go build -o /tmp/gleaner-server-gse ./cmd/gleaner-server
