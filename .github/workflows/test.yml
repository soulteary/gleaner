name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"

      - name: Install CGO dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./... -count=1

      - name: Build binaries
        run: |
          go build -o /tmp/gleaner-server ./cmd/gleaner-server
          go build -o /tmp/gleaner ./cmd/gleaner

  test-gse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"

      - name: Go test (GSE, no CGO)
        env:
          CGO_ENABLED: "0"
          GLEANER_SEGMENT_BACKEND: gse
        run: go test ./... -count=1

      - name: Build GSE server
        env:
          CGO_ENABLED: "0"
          GLEANER_SEGMENT_BACKEND: gse
        run: go build -o /tmp/gleaner-server-gse ./cmd/gleaner-server
